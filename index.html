<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SpeakUp" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>SpeakUp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">

    <!-- HOME -->
    <section class="screen active" id="screen-home">
      <div class="robot small" id="homeRobot"></div>
      <div class="bubble-say" id="homeSay">Hi! I'm Bolt. Let's talk 🤖</div>

      <div class="card">
        <div class="label">What do you want to talk about?</div>
        <div class="chips" id="topicChips"></div>
        <input id="customTopic" class="input" placeholder="Or type your own topic" />
      </div>

      <button class="btn primary big" id="startBtn">
        <span class="mic-ico">●</span> Start talking
      </button>
      <p class="hint" id="homeHint"></p>
      <div class="card install" id="installHint">
        <div class="label">Install as an app</div>
        <div>In Safari tap <b>Share</b> (square with an arrow) → <b>Add to Home Screen</b>. SpeakUp will appear next to your other apps.</div>
      </div>
    </section>

    <!-- CALL -->
    <section class="screen" id="screen-call">
      <div class="call-head">
        <div class="status" id="callStatus">Connecting…</div>
        <div class="timer" id="callTimer">00:00</div>
      </div>

      <div class="robot robot-wrap" id="callRobot"></div>

      <div class="transcript" id="transcript"></div>

      <div class="call-controls">
        <button class="round" id="muteBtn" title="Mic">🎙️</button>
        <button class="round danger" id="endBtn" title="End">✕</button>
        <button class="round" id="topicBtn" title="New topic">🔀</button>
      </div>
      <div class="ctrl-labels"><span>Mic</span><span>End</span><span>New topic</span></div>
    </section>

    <!-- SUMMARY -->
    <section class="screen" id="screen-summary">
      <header class="top"><h1>Session summary</h1><p class="sub" id="summaryMeta"></p></header>
      <div id="summaryList" class="list"></div>
      <button class="btn primary" id="summaryDone">Done</button>
    </section>

    <!-- MISTAKES -->
    <section class="screen" id="screen-mistakes">
      <header class="top"><h1>My mistakes</h1><p class="sub" id="mistakesMeta"></p></header>
      <div id="mistakesList" class="list"></div>
      <button class="btn ghost" id="clearMistakes">Clear all</button>
    </section>

    <!-- SETTINGS -->
    <section class="screen" id="screen-settings">
      <header class="top"><h1>Settings</h1></header>
      <div class="card">
        <label class="label" for="apiKey">OpenAI API key</label>
        <input id="apiKey" class="input" type="password" placeholder="sk-..." autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" />
        <p class="hint">Stored only on this phone.</p>
      </div>
      <div class="card">
        <label class="label" for="robotName">Robot name</label>
        <input id="robotName" class="input" placeholder="Bolt" />

        <label class="label" for="personality">Personality</label>
        <select id="personality" class="input">
          <option value="cheeky">😏 Cheeky — roasts your mistakes</option>
          <option value="kind">🥰 Kind — supportive and sweet</option>
          <option value="coach">💪 Strict coach — less chat, more practice</option>
        </select>

        <label class="label" for="level">My level</label>
        <select id="level" class="input">
          <option value="A2">A2 — elementary</option>
          <option value="B1">B1 — intermediate</option>
          <option value="B2">B2 — upper-intermediate</option>
          <option value="C1">C1 — advanced</option>
        </select>

        <label class="label" for="strictness">Correction strictness</label>
        <select id="strictness" class="input">
          <option value="gentle">Gentle — only serious mistakes</option>
          <option value="normal">Normal</option>
          <option value="strict">Strict — every mistake + repeat the sentence</option>
        </select>

        <label class="label" for="voice">Voice</label>
        <select id="voice" class="input">
          <option value="marin">Marin</option>
          <option value="cedar">Cedar</option>
          <option value="alloy">Alloy</option>
          <option value="ash">Ash</option>
          <option value="coral">Coral</option>
          <option value="sage">Sage</option>
          <option value="verse">Verse</option>
        </select>

        <label class="label" for="accent">Accent</label>
        <select id="accent" class="input">
          <option value="American">American</option>
          <option value="British">British</option>
        </select>

        <label class="label" for="model">Model</label>
        <select id="model" class="input">
          <option value="gpt-realtime">gpt-realtime — best quality</option>
          <option value="gpt-realtime-mini">gpt-realtime-mini — cheaper</option>
        </select>
        <input id="modelCustom" class="input" placeholder="or a custom model (optional)" />
      </div>
      <button class="btn primary" id="saveSettings">Save</button>
      <p class="hint center" id="savedHint"></p>
    </section>

  </main>

  <nav class="tabs" id="tabs">
    <button data-screen="home" class="active">💬<span>Talk</span></button>
    <button data-screen="mistakes">📒<span>Mistakes</span></button>
    <button data-screen="settings">⚙️<span>Settings</span></button>
  </nav>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <script src="robot.js"></script>
  <script src="topics.js"></script>
  <script src="tutor.js"></script>
  <script src="realtime.js"></script>
  <script src="app.js"></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
